<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standoff Arena</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="hud">
    <div id="player-card-player" class="player-card side-left team-green">
      <div class="card-header">
        <span class="card-title">PLAYER 1 <span class="team-tag">(GREEN)</span></span>
      </div>
      <div class="lives-row">LIVES: <span class="lives-value">3</span></div>
      <div class="health-block">
        <span class="health-label">HEALTH</span>
        <div class="health-pips" id="pips-player"></div>
      </div>
      <div class="weapon-row">
        <span class="weapon-icon">P</span>
        <span class="weapon-name">PISTOL</span>
        <span class="weapon-ammo">
          <span class="ammo-current" id="ammo-current-player">8</span>/<span class="ammo-mag" id="ammo-mag-player">8</span>
          <span class="ammo-reserve">[<span id="ammo-reserve-player">24</span>]</span>
        </span>
      </div>
    </div>

    <div id="timer-pill">TIME: <span id="timer-value">02:00</span></div>

    <div id="player-card-enemy" class="player-card side-right team-red">
      <div class="card-header">
        <span class="card-title">PLAYER 2 <span class="team-tag">(RED)</span></span>
      </div>
      <div class="lives-row">LIVES: <span class="lives-value">3</span></div>
      <div class="health-block">
        <span class="health-label">HEALTH</span>
        <div class="health-pips" id="pips-enemy"></div>
      </div>
      <div class="weapon-row">
        <span class="weapon-icon">P</span>
        <span class="weapon-name">PISTOL</span>
        <span class="weapon-ammo">
          <span class="ammo-current" id="ammo-current-enemy">8</span>/<span class="ammo-mag" id="ammo-mag-enemy">8</span>
          <span class="ammo-reserve">[<span id="ammo-reserve-enemy">24</span>]</span>
        </span>
      </div>
    </div>

    <div id="hit-marker"></div>
  </div>

  <div id="damage-flash"></div>

  <div id="start-screen" class="overlay">
    <h1>STANDOFF ARENA</h1>
    <p>WASD to move &middot; Mouse to aim &middot; Click to shoot &middot; R to reload</p>
    <button id="start-button">Click to Start</button>
  </div>

  <div id="end-screen" class="overlay hidden">
    <h1 id="end-title">YOU WIN</h1>
    <button id="restart-button">Play Again</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
